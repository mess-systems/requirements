name: requirements
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Словарь naming-standard и матрицы проверок blueprints на зафиксированных коммитах (reqs.config.yaml)
      - uses: actions/checkout@v4
        with: { repository: mess-systems/naming-standard, ref: 2d688b7985e5414043e1766c089a7ee534794038, path: .ext/naming-standard }
      - uses: actions/checkout@v4
        with: { repository: mess-systems/blueprints, ref: 77f8abc558786651ce9fb601493216b310b9a583, path: .ext/blueprints }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: Schema, config, catalog, profiles, adoption, privacy
        env: { NAMING: .ext/naming-standard, BLUEPRINTS: .ext/blueprints }
        run: python scripts/validate.py --report violations.md
      - name: REGISTER.md, CATALOG.md, register.json, ids.lock, requirements/_catalog up to date
        run: python scripts/generate.py --check
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: violations, path: violations.md, if-no-files-found: ignore }
  trace:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: OpenFastTrace (advisory)
        continue-on-error: true   # статус покрытия рекомендательный, см. docs/process/status-policy.md
        run: |
          curl -sSLo oft.jar https://github.com/itsallcode/openfasttrace/releases/download/4.11.0/openfasttrace-4.11.0.jar
          echo "f094cd314f0fc4236f513f66fb39260a16f72e2320beb6b4fdeb7940b9b8cf87  oft.jar" | sha256sum -c -
          java -jar oft.jar trace -o html -f trace.html requirements examples/impl-repo
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: trace, path: trace.html, if-no-files-found: ignore }
