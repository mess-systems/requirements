id: adlc-agent-delivery
kind: class
title: Агентский delivery workspace
version: 0.1.0
status: draft
owner: role-platform-engineers
blueprint: adlc-agent-delivery
blueprint_status: draft
description: >-
  Рабочее пространство поставки ПО, где процессы соединяют coding-агентов, скрипты и людей с шагами одобрения.
  Код возможности delivery в домене adlc предложен к внесению в naming-standard. Профиль пока состоит из
  сквозных наборов; возможности класса из разбора Tencent LoopForge v0.4.3 переносятся следующим шагом.
includes: [ent-baseline@0.1, ai-usage-baseline@0.1, agent-exec-baseline@0.1]
items: []
